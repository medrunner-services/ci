name: wf-test-node

on:
  workflow_call:
    inputs:
      runs-on:
        description: Single runner label used when runs-on-json is empty.
        required: false
        type: string
        default: ubuntu-latest
      runs-on-json:
        description: JSON runner-label array that overrides runs-on when set.
        required: false
        type: string
        default: ""
      runs-on-self-hosted:
        description: Enables self-hosted runner preflight diagnostics.
        required: false
        type: boolean
        default: false
      node-version:
        description: Node.js version to install.
        required: false
        type: string
        default: 24.x
      working-directory:
        description: Repository-relative Node project directory.
        required: false
        type: string
        default: .
      package-manager:
        description: npm or pnpm; pnpm version comes from package.json.
        type: string
        default: npm
      build-script:
        type: string
        default: build
      lint-script:
        description: Use check to include type checks where the caller provides it.
        type: string
        default: lint
      npm-scope:
        description: Private GitHub Packages npm scope.
        required: false
        type: string
        default: "@medrunner-services"
      private-packages:
        description: Enables GitHub Packages npm authentication.
        required: false
        type: boolean
        default: false
      run-build:
        description: Runs the selected build script.
        required: false
        type: boolean
        default: true
      run-lint:
        description: Runs the selected lint/check script.
        required: false
        type: boolean
        default: true
      run-prettier:
        description: Runs npm run prettier.
        required: false
        type: boolean
        default: true
      run-test:
        description: Runs npm test.
        required: false
        type: boolean
        default: true
      timeout-minutes:
        description: Job timeout.
        required: false
        type: number
        default: 30

permissions: {}

jobs:
  test:
    env:
      PACKAGE_MANAGER: ${{ inputs.package-manager }}
      BUILD_SCRIPT: ${{ inputs.build-script }}
      LINT_SCRIPT: ${{ inputs.lint-script }}
      pnpm_config_verify_deps_before_run: "false"
    name: ${{ inputs.working-directory }} @ Node ${{ inputs.node-version }}
    runs-on: ${{ fromJSON(inputs.runs-on-json || format('[{0}]', toJSON(inputs.runs-on || 'ubuntu-latest'))) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout caller
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate inputs
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          case "$WORKING_DIRECTORY" in
            ""|/*|*".."*)
              echo "working-directory must be a repository-relative path without '..'." >&2
              exit 2
              ;;
          esac
          test -f "$WORKING_DIRECTORY/package.json"
          case "$PACKAGE_MANAGER" in npm|pnpm) ;; *) echo 'Use npm or pnpm.' >&2; exit 2 ;; esac

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        if: ${{ inputs.package-manager == 'pnpm' }}
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - name: Setup dependency cache and registry
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
          registry-url: ${{ inputs.private-packages && 'https://npm.pkg.github.com' || 'https://registry.npmjs.org' }}
          scope: ${{ inputs.private-packages && inputs.npm-scope || '' }}

      - name: Record runner contract
        env:
          RUNS_ON_SELF_HOSTED: ${{ inputs.runs-on-self-hosted }}
          RUNS_ON_JSON: ${{ inputs.runs-on-json || format('[{0}]', toJSON(inputs.runs-on || 'ubuntu-latest')) }}
        run: |
          {
            echo "## Node test"
            echo
            echo "- Runner labels: \`$RUNS_ON_JSON\`"
            echo "- Self-hosted: \`$RUNS_ON_SELF_HOSTED\`"
            echo "- Node: \`$(node --version)\`"
            echo "- npm: \`$(npm --version)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Self-hosted preflight
        if: ${{ inputs.runs-on-self-hosted }}
        run: |
          df -h .
          command -v docker || true

      - name: Install locked dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ inputs.private-packages && github.token || '' }}
        run: |
          if [ "$PACKAGE_MANAGER" = pnpm ]; then pnpm install --frozen-lockfile; else npm ci; fi

      - name: Build
        if: ${{ inputs.run-build }}
        working-directory: ${{ inputs.working-directory }}
        run: '"$PACKAGE_MANAGER" run "$BUILD_SCRIPT"'

      - name: Lint
        if: ${{ inputs.run-lint }}
        working-directory: ${{ inputs.working-directory }}
        run: '"$PACKAGE_MANAGER" run "$LINT_SCRIPT"'

      - name: Check Prettier
        if: ${{ inputs.run-prettier }}
        working-directory: ${{ inputs.working-directory }}
        run: '"$PACKAGE_MANAGER" run prettier'

      - name: Test
        if: ${{ inputs.run-test }}
        working-directory: ${{ inputs.working-directory }}
        run: '"$PACKAGE_MANAGER" run test'
