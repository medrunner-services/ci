name: Build Node artifact

on:
  workflow_call:
    inputs:
      environment-name:
        description: Caller GitHub environment containing public build variables.
        required: true
        type: string
      source-ref:
        description: Commit or release tag to build; defaults to the workflow commit.
        type: string
        default: ""
      node-version:
        type: string
        default: 24.x
      package-manager:
        description: npm or pnpm; pnpm version comes from package.json.
        type: string
        default: pnpm
      working-directory:
        type: string
        default: .
      private-packages:
        type: boolean
        default: false
      npm-scope:
        type: string
        default: "@medrunner-services"
      check-script:
        description: Package script to check sources; empty skips it.
        type: string
        default: check
      test-script:
        description: Package script to test sources; empty skips it.
        type: string
        default: test
      build-script:
        type: string
        default: build
      version:
        description: Optional generated semantic version, applied locally after dependency installation.
        type: string
        default: ""
      public-env-map:
        description: JSON object mapping shell variable names to GitHub configuration variable names.
        type: string
        default: "{}"
      public-env-overrides:
        description: JSON object of public literal overrides, such as a preview callback origin.
        type: string
        default: "{}"
      required-public-env:
        description: JSON array of nonempty required shell variables from the public mapping.
        type: string
        default: "[]"
      artifact-path:
        description: Output directory relative to working-directory.
        type: string
        default: dist
      artifact-name:
        description: Unique artifact prefix when the caller invokes this workflow more than once.
        type: string
        default: node-build
    outputs:
      artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
      source-sha:
        value: ${{ jobs.build.outputs.source-sha }}
      version:
        value: ${{ jobs.build.outputs.version }}

permissions: {}

jobs:
  build:
    env:
      # Install once from the frozen lockfile; version stamping must not reinstall packages.
      pnpm_config_verify_deps_before_run: "false"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment-name }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      artifact-name: ${{ inputs.artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}
      source-sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Validate build inputs
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          for path in "$WORKING_DIRECTORY" "$ARTIFACT_PATH"; do
            case "$path" in ""|/*|*".."*|*\\*) echo "Expected a repository-relative path." >&2; exit 1 ;; esac
          done
          case "$PACKAGE_MANAGER" in npm|pnpm) ;; *) echo "Unsupported package manager." >&2; exit 1 ;; esac
          test -f "$WORKING_DIRECTORY/package.json"
      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        if: ${{ inputs.package-manager == 'pnpm' }}
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - name: Setup dependency cache and optional registry
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
          registry-url: ${{ inputs.private-packages && 'https://npm.pkg.github.com' || 'https://registry.npmjs.org' }}
          scope: ${{ inputs.npm-scope }}
      - name: Set public build environment
        env:
          PUBLIC_VARIABLES: ${{ toJSON(vars) }}
          PUBLIC_ENV_MAP: ${{ inputs.public-env-map }}
          PUBLIC_ENV_OVERRIDES: ${{ inputs.public-env-overrides }}
          REQUIRED_PUBLIC_ENV: ${{ inputs.required-public-env }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          const object = text => {
            const value = JSON.parse(text);
            assert.ok(value && !Array.isArray(value) && typeof value === 'object', 'Expected a JSON object');
            return value;
          };
          const values = object(process.env.PUBLIC_VARIABLES);
          const mapping = object(process.env.PUBLIC_ENV_MAP);
          const overrides = object(process.env.PUBLIC_ENV_OVERRIDES);
          const required = JSON.parse(process.env.REQUIRED_PUBLIC_ENV);
          assert.ok(Array.isArray(required), 'required-public-env must be a JSON array');
          const selected = Object.fromEntries(Object.entries(mapping).map(([key, variable]) => {
            assert.ok(typeof variable === 'string' && /^[A-Z_][A-Z0-9_]*$/.test(variable), 'Invalid configuration variable name');
            return [key, values[variable] || ''];
          }));
          Object.assign(selected, overrides);
          for (const [key, value] of Object.entries(selected)) {
            assert.ok(/^[A-Z_][A-Z0-9_]*$/.test(key) && !/^(GITHUB_|RUNNER_|ACTIONS_)/.test(key) && !['NODE_OPTIONS', 'NODE_AUTH_TOKEN', 'PATH', 'HOME'].includes(key), 'Invalid or reserved build variable');
            assert.ok(typeof value === 'string' && !/[\r\n\0]/.test(value), `${key} must be a single-line string`);
          }
          for (const key of required) assert.ok(Object.hasOwn(selected, key) && selected[key].trim(), `${key} is required in the selected environment`);
          appendFileSync(process.env.GITHUB_ENV, Object.entries(selected).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE
      - name: Install locked dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          NODE_AUTH_TOKEN: ${{ inputs.private-packages && github.token || '' }}
        run: |
          if [ "$PACKAGE_MANAGER" = pnpm ]; then pnpm install --frozen-lockfile; else npm ci; fi
      - name: Check sources
        if: ${{ inputs.check-script != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          SCRIPT: ${{ inputs.check-script }}
        run: '"$PACKAGE_MANAGER" run "$SCRIPT"'
      - name: Run tests
        if: ${{ inputs.test-script != '' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          SCRIPT: ${{ inputs.test-script }}
        run: '"$PACKAGE_MANAGER" run "$SCRIPT"'
      - name: Set build version
        id: version
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const path = join(process.env.WORKING_DIRECTORY, 'package.json');
          const pkg = JSON.parse(readFileSync(path, 'utf8'));
          const version = process.env.RELEASE_VERSION || pkg.version;
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/, 'Invalid build version');
          if (process.env.RELEASE_VERSION) writeFileSync(path, JSON.stringify({ ...pkg, version }, null, 2) + '\n');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          SCRIPT: ${{ inputs.build-script }}
        run: '"$PACKAGE_MANAGER" run "$SCRIPT"'
      - name: Upload build artifact
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}/
          if-no-files-found: error
          retention-days: 3
