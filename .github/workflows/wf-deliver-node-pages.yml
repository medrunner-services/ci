name: Deliver versioned Node site to Pages

on:
  workflow_call:
    inputs:
      production-branch:
        type: string
        default: release/stable
      staging-branch:
        type: string
        default: main
      environment-prefix:
        type: string
        default: deploy-cf
      preview-branch-prefixes:
        description: Comma-separated source branch prefixes eligible for same-repository non-draft previews.
        type: string
        default: feat/,fix/
      preview-callback-variable:
        description: Optional public shell variable to replace with the generated preview origin.
        type: string
        default: ""
      config-path:
        type: string
        default: wrangler.json
      release-tag:
        description: Existing vX.Y.Z or vX.Y.Z-dev.N tag for manual redeployment.
        type: string
        default: ""
      private-packages:
        type: boolean
        default: false
      npm-scope:
        type: string
        default: "@medrunner-services"
      public-env-map:
        type: string
        default: "{}"
      required-public-env:
        type: string
        default: "[]"
      wrangler-version:
        type: string
        default: 4.148.0
    outputs:
      environment-name:
        value: ${{ jobs.route.outputs.environment-name }}
      deployment-url:
        value: ${{ jobs.deploy.outputs.deployment-url }}
      deployed:
        value: ${{ jobs.deploy.outputs.deployed }}
      version:
        value: ${{ github.event_name == 'push' && jobs.build-release.outputs.version || jobs.verify.outputs.version }}

permissions: {}

jobs:
  route:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environment-name: ${{ steps.route.outputs.environment-name }}
      branch: ${{ steps.route.outputs.branch }}
      source-sha: ${{ steps.route.outputs.source-sha }}
      config-ref: ${{ steps.route.outputs.config-ref }}
      deploy: ${{ steps.route.outputs.deploy }}
      build-script: ${{ steps.route.outputs.build-script }}
      public-env-overrides: ${{ steps.route.outputs.public-env-overrides }}
      version: ${{ steps.route.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Select delivery target
        id: route
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          PRODUCTION_BRANCH: ${{ inputs.production-branch }}
          STAGING_BRANCH: ${{ inputs.staging-branch }}
          ENVIRONMENT_PREFIX: ${{ inputs.environment-prefix }}
          PREVIEW_BRANCH_PREFIXES: ${{ inputs.preview-branch-prefixes }}
          PREVIEW_CALLBACK_VARIABLE: ${{ inputs.preview-callback-variable }}
          CONFIG_PATH: ${{ inputs.config-path }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const env = process.env;
          const event = JSON.parse(readFileSync(env.GITHUB_EVENT_PATH, 'utf8'));
          let sha = env.GITHUB_SHA, configRef = sha, branch, target, deploy = true, version = '';
          const overrides = {};
          if (env.GITHUB_EVENT_NAME === 'pull_request') {
            const pr = event.pull_request;
            assert.ok([env.STAGING_BRANCH, env.PRODUCTION_BRANCH].includes(pr.base.ref), 'Unsupported PR target');
            assert.ok(Number.isSafeInteger(event.number) && event.number > 0, 'Invalid PR number');
            branch = 'pr-' + event.number;
            target = 'preview';
            configRef = pr.base.sha;
            deploy = pr.head.repo.full_name === env.GITHUB_REPOSITORY && env.PREVIEW_BRANCH_PREFIXES.split(',').map(prefix => prefix.trim()).filter(Boolean).some(prefix => pr.head.ref.startsWith(prefix) && pr.head.ref.length > prefix.length) && !pr.draft;
            if (deploy && env.PREVIEW_CALLBACK_VARIABLE) {
              const project = JSON.parse(readFileSync(env.CONFIG_PATH, 'utf8')).name;
              assert.match(project, /^[a-z0-9][a-z0-9-]+$/, 'Invalid Pages project');
              overrides[env.PREVIEW_CALLBACK_VARIABLE] = 'https://' + branch + '.' + project + '.pages.dev';
            }
          } else {
            assert.ok(['push', 'workflow_dispatch'].includes(env.GITHUB_EVENT_NAME), 'Unsupported event');
            assert.ok(['refs/heads/' + env.STAGING_BRANCH, 'refs/heads/' + env.PRODUCTION_BRANCH].includes(env.GITHUB_REF), 'Unsupported deployment branch');
            branch = env.GITHUB_REF.slice('refs/heads/'.length);
            target = branch === env.PRODUCTION_BRANCH ? 'production' : 'staging';
            if (env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
              const pattern = target === 'production' ? /^v(\d+\.\d+\.\d+)$/ : /^v(\d+\.\d+\.\d+-dev\.\d+)$/;
              const match = pattern.exec(env.RELEASE_TAG || '');
              assert.ok(match, 'Select a release tag matching the target channel');
              sha = execFileSync('git', ['rev-parse', '--verify', env.RELEASE_TAG + '^{commit}'], { encoding: 'utf8' }).trim();
              execFileSync('git', ['merge-base', '--is-ancestor', sha, env.GITHUB_SHA]);
              configRef = sha;
              version = match[1];
            }
          }
          assert.match(sha, /^[a-f0-9]{40}$/i, 'Invalid source commit');
          assert.match(configRef, /^[a-f0-9]{40}$/i, 'Invalid trusted configuration commit');
          const outputs = { 'environment-name': env.ENVIRONMENT_PREFIX + '-' + target, branch, 'source-sha': sha, 'config-ref': configRef,
            deploy, 'build-script': target === 'production' ? 'build' : 'build:staging',
            'public-env-overrides': JSON.stringify(overrides), version };
          appendFileSync(env.GITHUB_OUTPUT, Object.entries(outputs).map(([key, value]) => key + '=' + value + '\n').join(''));
          NODE

  verify:
    needs: route
    uses: ./.github/workflows/wf-build-node.yml
    permissions:
      contents: read
      packages: read
    with:
      environment-name: ${{ needs.route.outputs.environment-name }}
      source-ref: ${{ needs.route.outputs.source-sha }}
      version: ${{ needs.route.outputs.version }}
      private-packages: ${{ inputs.private-packages }}
      npm-scope: ${{ inputs.npm-scope }}
      build-script: ${{ needs.route.outputs.build-script }}
      artifact-name: portal-verify
      public-env-overrides: ${{ needs.route.outputs.public-env-overrides }}
      public-env-map: ${{ inputs.public-env-map }}
      required-public-env: ${{ inputs.required-public-env }}

  release:
    if: ${{ github.event_name == 'push' }}
    needs: verify
    uses: ./.github/workflows/wf-release-semantic.yml
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      environment-name: release
      release-ref-name: ${{ inputs.production-branch }}
      default-branch: ${{ inputs.staging-branch }}
      backpropagation-approve: false
      backpropagation-auto-merge: false

  build-release:
    if: ${{ needs.release.outputs.release-published == 'true' }}
    needs: [route, release]
    uses: ./.github/workflows/wf-build-node.yml
    permissions:
      contents: read
      packages: read
    with:
      environment-name: ${{ needs.route.outputs.environment-name }}
      source-ref: ${{ needs.release.outputs.new-tag }}
      version: ${{ needs.release.outputs.new-version }}
      private-packages: ${{ inputs.private-packages }}
      npm-scope: ${{ inputs.npm-scope }}
      build-script: ${{ needs.route.outputs.build-script }}
      artifact-name: portal-release
      # Verification already checked this commit before publishing the tag.
      check-script: ""
      test-script: ""
      public-env-map: ${{ inputs.public-env-map }}
      required-public-env: ${{ inputs.required-public-env }}

  deploy:
    needs: [route, verify, release, build-release]
    if: >-
      ${{ !cancelled() && needs.route.outputs.deploy == 'true' &&
          ((github.event_name == 'push' && needs.build-release.result == 'success') ||
           (github.event_name != 'push' && needs.verify.result == 'success')) }}
    uses: ./.github/workflows/wf-deploy-cloudflare-pages.yml
    permissions:
      contents: read
    with:
      environment-name: ${{ needs.route.outputs.environment-name }}
      artifact-id: ${{ github.event_name == 'push' && needs.build-release.outputs.artifact-id || needs.verify.outputs.artifact-id }}
      source-sha: ${{ github.event_name == 'push' && needs.build-release.outputs.source-sha || needs.verify.outputs.source-sha }}
      config-ref: ${{ github.event_name == 'push' && needs.release.outputs.new-tag || needs.route.outputs.config-ref }}
      branch: ${{ needs.route.outputs.branch }}
      production-branch: ${{ inputs.production-branch }}
      config-path: ${{ inputs.config-path }}
      wrangler-version: ${{ inputs.wrangler-version }}
