name: Validate OpenTofu configuration
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: deployment/cloudflare
      tofu-version:
        type: string
        default: 1.13.1
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.tofu-version }}
          tofu_wrapper: false
      - name: Validate without credentials or applying changes
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          tofu fmt -check
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate
